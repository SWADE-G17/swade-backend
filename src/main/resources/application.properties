# SpringDoc / Swagger UI (open http://localhost:8080/swagger-ui.html or /swagger-ui/index.html)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# File upload (e.g. for large NIfTI files)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# RabbitMQ (defaults work if broker is local; override via env vars in prod)
# spring.rabbitmq.host=localhost
# spring.rabbitmq.port=5672
# spring.rabbitmq.username=guest
# spring.rabbitmq.password=guest

# Set to false to run without RabbitMQ (e.g., local tests)
swade.rabbitmq.listener.enabled=true

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access.key=${MINIO_ACCESS_KEY:minio}
minio.secret.key=${MINIO_SECRET_KEY:minio123}
minio.bucket.name=${MINIO_BUCKET_NAME:mri-files}

# Bucket where the Python worker uploads <id>_heatmap.nii.gz and <id>_orig.mgz.
# Must match the worker's MINIO_HEATMAP_BUCKET environment variable.
mri.minio.heatmap-bucket=${MINIO_HEATMAP_BUCKET:heatmaps}

# Bucket where the Python worker uploads <id>_report.pdf.
# Must match the worker's MINIO_REPORT_BUCKET environment variable. Used as a
# fallback only; the actual bucket/key is read from resultado.report_path.
mri.minio.report-bucket=${MINIO_REPORT_BUCKET:reports}

# ─── Supabase Postgres (Session Pooler) ──────────────────────────────
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=20000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ─── Supabase JWT authentication ──────────────────────────────────────
supabase.jwt.jwks-uri=${SUPABASE_JWKS_URI}
supabase.jwt.issuer=${SUPABASE_JWT_ISSUER}

# ─── CORS ─────────────────────────────────────────────────────────────
swade.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
